---
server:
  host: "127.0.0.1"
  port: 8300
  cors:
    origins: []

database:
  path: "${AGENT_PROXY_DATABASE_PATH}"

herdr:
  binary: "herdr"
  workspace_label: "agent-proxy"

auth:
  enabled: true
  admin_token: "${ADMIN_TOKEN}"
  initial_keys:
    - name: "default"
      key: "${PROXY_API_KEY}"

# Enable a provider only after its CLI is installed and authenticated for the
# logged-in user.
providers:
  claude:
    enabled: false
    cli_path: "claude"
    default_model: "claude-sonnet-5"
    max_concurrent: 1
    max_queue_size: 32
    max_queue_wait_ms: 30000
    timeout_ms: 300000
    extra_args:
      - "--no-session-persistence"
      - "--setting-sources"
      - ""
      - "--tools"
      - ""
  codex:
    enabled: false
    cli_path: "codex"
    default_model: "gpt-5.6-sol"
    max_concurrent: 1
    max_queue_size: 32
    max_queue_wait_ms: 30000
    timeout_ms: 300000
    extra_args:
      - "--skip-git-repo-check"
      - "--sandbox"
      - "read-only"
    cli_options:
      ephemeral: true
      enable_session_reuse: false
  agy:
    enabled: false
    cli_path: "agy"
    default_model: "antigravity"
    max_queue_size: 32
    max_queue_wait_ms: 30000
  grok:
    enabled: false
    cli_path: "grok"
    default_model: "grok-4.5"
    max_concurrent: 1
    max_queue_size: 32
    max_queue_wait_ms: 30000
    timeout_ms: 300000
    extra_args:
      - "--no-memory"
      - "--no-subagents"
      - "--disable-web-search"
      - "--tools"
      - ""

responses:
  retention_ttl_ms: 1800000
  max_entries: 1000
